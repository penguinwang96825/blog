name: get-citation-data

on:
  page_build:
  schedule:
    # 每兩天 UTC 03:17 執行
    - cron: "17 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        working-directory: google_scholar_crawler
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch Scholar statistics
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python main.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-crawler-diagnostics
          path: google_scholar_crawler/results/scholar-failure-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish results branch
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          git init
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:google-scholar-stats --force
